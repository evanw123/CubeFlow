services:
  - type: web
    name: cubeflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: python app_server.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: CUBEFLOW_MODE
        value: web
      - key: PYTHON_VERSION
        value: 3.11.11
